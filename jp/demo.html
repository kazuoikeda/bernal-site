<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bernal 0件検索の新しい表示（デモ）</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* レイアウト: 1カラムの検索画面。上に検索欄、下に AI の概要・対話・近い記事・連載を縦に積む */
:root {
  --bg: #ffffff;
  --fg: #1d2433;
  --muted: #5d667a;
  --line: #dfe3ec;
  --panel: #eef1fa;
  --accent: #2b407e;
  --accent-fg: #ffffff;
  --link: #2c4e9e;
  --thumb: #e1e4ea;
  --pill: #f1f3f7;
  --premium: #e8a317;
  --font: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --fg: #e6e9f2; --muted: #98a1b5; --line: #2b3244; --panel: #1b2234;
    --accent: #5b78c9; --accent-fg: #ffffff; --link: #8fa8ea; --thumb: #2a3040; --pill: #1c2130; --premium: #f0b43a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --fg: #e6e9f2; --muted: #98a1b5; --line: #2b3244; --panel: #1b2234;
  --accent: #5b78c9; --accent-fg: #ffffff; --link: #8fa8ea; --thumb: #2a3040; --pill: #1c2130; --premium: #f0b43a;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7;
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 18px; margin: 0; font-weight: 700; text-wrap: balance; }
.searchbox { position: relative; }
.searchbox input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px 46px 12px 16px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
.searchbox button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; }
input::placeholder { color: var(--muted); opacity: .8; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tries { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.tries button { font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--link); cursor: pointer; }
#out { display: flex; flex-direction: column; gap: 16px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.head { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.ai { flex: none; font-size: 11px; line-height: 1; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--bg); }
.src { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.srcrow { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.tag { font-size: 11px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--bg); }
.note { font-size: 12px; color: var(--muted); }
a { color: var(--link); }
.linkcard { display: block; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; color: var(--fg); }
.linkcard b { color: var(--link); font-weight: 500; display: block; }
.linkcard span { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--link); cursor: pointer; }
.chip:hover { background: var(--panel); }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.ask button { font: inherit; font-size: 14px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.pill { align-self: flex-start; background: var(--pill); border-radius: 999px; padding: 4px 16px; font-size: 14px; }
.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 4px 16px; font-size: 14px; max-width: 100%; overflow-wrap: anywhere; }
.convo { display: flex; flex-direction: column; gap: 10px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > .label { font-size: 13px; color: var(--muted); }
.item { display: flex; flex-direction: column; gap: 6px; }
.badge { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.badge .tag { color: var(--link); background: var(--panel); border-color: var(--line); }
.row { display: flex; gap: 16px; align-items: center; }
.thumb { flex: none; width: 88px; height: 56px; border-radius: 6px; background: var(--thumb); }
.title { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.lock { flex: none; width: 18px; height: 18px; border-radius: 5px; background: var(--premium); display: inline-grid; place-items: center; }
.lock svg { width: 11px; height: 11px; }
.foot { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .thumb { width: 64px; height: 44px; } .row { gap: 12px; } }
@media (prefers-reduced-motion: no-preference) { .card, .convo > *, .sec { animation: in .25s ease-out; } @keyframes in { from { opacity: .0; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
html{color-scheme:light dark}
body{margin:0}
</style>

</head>
<body>
<div class="wrap">
  <h1>Bernal 0件検索の新しい表示（デモ）</h1>
  <form class="searchbox" id="searchForm" autocomplete="off">
    <input id="q" type="text" placeholder="記事を検索..." aria-label="記事を検索">
    <button type="submit" aria-label="検索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </form>
  <div class="tries">試してみる:
    <button type="button" data-q="宇良の技">宇良の技</button>
    <button type="button" data-q="大谷ホームラン数">大谷ホームラン数</button>
    <button type="button" data-q="ホゲホゲ">ホゲホゲ</button>
  </div>
  <div id="out" aria-live="polite"></div>
  <div class="note">記事の題名やリンクはデモ用の例です。</div>
</div>

<script>
var LOCK = '<span class="lock" title="有料記事"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>';
var LICENSE = 'AIによる概要です。Wikipediaの記事をもとに作成しており、誤りを含むことがあります。 ライセンス: <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 4.0</a>';

var SERIES = {
  mlb: { series: 'MLB最前線', title: 'MLB最前線 第1回' },
  sumo: { series: '相撲の達人たち', title: '相撲の達人たち 第1回' },
  dohyo: { series: '土俵の裏側', title: '土俵の裏側 第1回', lock: true }
};
var TOPICS = [
  { keys: ['宇良'], who: '宇良関',
    summary: '宇良和輝は、低い姿勢から相手の懐に入る取り口で知られる力士です。足取りなどの足を使った技を得意とし、「アクロバット相撲」とも評されています。',
    wiki: ['宇良和輝'],
    links: [['大相撲 取組速報', '日刊スポーツ（無料）で、取組の速報を見られます。']],
    chips: ['足取りの解説', '最近の取組', 'プロフィール'],
    articles: [{ title: '宇良の連勝の舞台裏 稽古場で磨いた足取り', lock: true }, { title: '宇良の足取りが冴える 低い姿勢から土俵際で逆転' }],
    series: [SERIES.sumo, SERIES.dohyo] },
  { keys: ['大谷'], who: '大谷翔平選手',
    summary: '大谷翔平は、投手と打者の両方で試合に出場する「二刀流」で知られる野球選手です。日本ハムからメジャーリーグに移り、投打の両方で活躍してきました。',
    wiki: ['大谷翔平', '二刀流選手'],
    links: [['MLB スコア速報', '日刊スポーツ（無料）で、メジャーリーグの速報を見られます。'], ['プロ野球 スコア速報', '日刊スポーツ（無料）で、試合の速報を見られます。']],
    chips: ['二刀流の記録', '今季の成績', 'プロフィール'],
    articles: [{ title: 'MLB最前線 第1回' }],
    series: [SERIES.mlb, SERIES.sumo, SERIES.dohyo] }
];
var NONE_SERIES = [SERIES.mlb, SERIES.sumo, SERIES.dohyo];

var state = { query: '', topic: null, log: [], related: null };
var out = document.getElementById('out');
var qInput = document.getElementById('q');

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function findTopic(q) {
  var best = null, pos = 1e9;
  TOPICS.forEach(function (t) {
    t.keys.forEach(function (k) { var i = q.indexOf(k); if (i >= 0 && i < pos) { pos = i; best = t; } });
  });
  return best;
}

function articleHtml(a, label) {
  return '<div class="item">' + (label ? '<div class="badge"><span class="tag">連載</span>' + esc(label) + ' ・第1回</div>' : '') +
    '<div class="row"><div class="thumb"></div><div class="title">' + esc(a.title) + (a.lock ? LOCK : '') + '</div></div></div>';
}
function seriesHtml(list) {
  return '<div class="sec"><div class="label">連載の第1回から読んでみませんか</div>' +
    list.map(function (s) { return articleHtml({ title: s.title, lock: s.lock }, s.series); }).join('') + '</div>';
}
function askHtml() {
  return '<form class="ask" id="askForm" autocomplete="off"><input id="ask" type="text" placeholder="ほかに知りたいことを入力" aria-label="ほかに知りたいことを入力"><button type="submit">送る</button></form>' +
    '<div class="foot">AIが応答します。誤りを含むことがあります。</div>';
}

function render() {
  if (!state.query) { out.innerHTML = ''; return; }
  var t = state.topic, h = '';
  var prompt = t ? t.who + 'について、どんなことを知りたいですか？' : 'もう少し詳しく教えてください。どんなことを知りたいですか？';
  if (t) {
    h += '<div class="card"><div class="head"><span class="ai">AI</span>関連する情報の概要</div><div>' + esc(t.summary) + '</div>' +
      '<div class="src">出典（外部サイトが開きます）</div>' +
      t.wiki.map(function (w) { return '<div class="srcrow"><span class="tag">Wikipedia</span><a href="https://ja.wikipedia.org/wiki/' + encodeURIComponent(w) + '" target="_blank" rel="noopener">' + esc(w) + '</a></div>'; }).join('') +
      '<div class="note">' + LICENSE + '</div></div>';
    t.links.forEach(function (l) { h += '<div class="linkcard"><b>' + esc(l[0]) + ' ›</b><span>' + esc(l[1]) + '</span></div>'; });
  }
  if (!state.log.length) {
    h += '<div class="convo"><div class="head"><span class="ai">AI</span>' + esc(prompt) + '</div>';
    if (t) h += '<div class="chips">' + t.chips.map(function (c) { return '<button type="button" class="chip" data-chip="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>';
    h += askHtml() + '</div>';
    h += seriesHtml(t ? t.series : NONE_SERIES);
  } else {
    h += '<div class="convo"><div class="pill">' + esc(prompt) + '</div>';
    state.log.forEach(function (m, i) {
      var last = i === state.log.length - 1;
      if (m.role === 'user') h += '<div class="me">' + esc(m.text) + '</div>';
      else if (last) h += '<div class="head" id="lastAi"><span class="ai">AI</span>' + esc(m.text) + '</div>';
      else h += '<div class="pill">' + esc(m.text) + '</div>';
    });
    h += askHtml() + '</div>';
    h += '<div class="sec"><div class="label">近い記事</div>' + state.related.map(function (a) { return articleHtml(a); }).join('') +
      '<div class="foot">いただいた内容に近い記事です。</div></div>';
  }
  out.innerHTML = h;
}

function search(q) {
  q = q.trim();
  if (!q) return;
  qInput.value = q;
  state = { query: q, topic: findTopic(q), log: [], related: null };
  render();
}
function send(text) {
  text = text.trim();
  if (!text) return;
  var t = state.topic;
  state.log.push({ role: 'user', text: text });
  state.log.push({ role: 'ai', text: '「' + text + '」について知りたいのですね。近い記事をご案内します。' });
  state.related = t ? t.articles : NONE_SERIES.map(function (s) { return { title: s.title, lock: s.lock }; });
  render();
  var el = document.getElementById('lastAi');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('searchForm').addEventListener('submit', function (e) { e.preventDefault(); search(qInput.value); });
document.querySelector('.tries').addEventListener('click', function (e) { var b = e.target.closest('button[data-q]'); if (b) search(b.dataset.q); });
out.addEventListener('click', function (e) { var b = e.target.closest('[data-chip]'); if (b) send(b.dataset.chip); });
out.addEventListener('submit', function (e) { if (e.target.id === 'askForm') { e.preventDefault(); send(document.getElementById('ask').value); } });
</script>

</body>
</html>
